services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - FLASK_SECRET=dev-secret-key
      - MYSQL_HOST=mysql
      - MYSQL_USER=vulnshop
      - MYSQL_PASSWORD=vulnshop
      - MYSQL_DB=vulnshop
      - MONGO_URL=mongodb://mongo:27017
      - ADMIN_OTP=SUPER-ADMIN-OTP
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./app:/app/app
    networks:
      - frontend
      - backend

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=vulnshop
      - MYSQL_USER=vulnshop
      - MYSQL_PASSWORD=vulnshop
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  mongo:
    image: mongo:7
    networks:
      - backend

  attacker:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vulnshop-attacker
    environment:
      - USER_NAME=attacker
      - USER_PASSWORD=PentestPass
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=true
    volumes:
      - ./attacker-init/10-install-responder.sh:/custom-cont-init.d/10-install-responder.sh
      - ./attacker-init/20-enable-sudo.sh:/custom-cont-init.d/20-enable-sudo.sh
      - ./attacker-init/30-install-nmap.sh:/custom-cont-init.d/30-install-nmap.sh
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:5555:5555"
    networks:
      - frontend

  metasploitable2:
    image: tleemcjr/metasploitable2:latest
    container_name: vulnshop-metasploitable2
    tty: true
    stdin_open: true
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
